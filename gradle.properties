# Loom checks the JVM Gradle itself runs on, not the java toolchain below, and Minecraft 26.x
# demands Java 25. If your JDK 25 lives elsewhere, do not edit this line - put your own
# org.gradle.java.home in ~/.gradle/gradle.properties, which takes precedence over this file.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-25.0.2.10-hotspot
# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false
kotlin.daemon.jvmargs=-Xmx2G
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=26.1.2
# Placeholder only - 26.x is unobfuscated and yarn stopped at 1.21.11. Loom requires the entry.
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
mixin_version=0.17.3+mixin.0.8.7
loom_version=1.17.18
# fabric-language-kotlin only depends on the loader, not on a Minecraft version, so the newest one
# is fine on 26.1.2. Keep the Kotlin plugin version in build.gradle.kts equal to the one it bundles.
kotlin_loader_version=1.13.13+kotlin.2.4.10
# Mod Properties
mod_version=1.4.0
maven_group=com.maxisch
archives_base_name=austrianpainter
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.150.0+26.1.2
devlogin_version=0.1.0.5
# NanoVG is the one LWJGL module Minecraft does not already ship, and it has to match the LWJGL
# core Minecraft is built against - LWJGL aborts at Configuration load when a module binding and
# the core disagree. `gradlew check` runs checkLwjglVersion, which fails the build if a Minecraft
# bump ever moves the core away from this.
lwjgl_version=3.4.1
